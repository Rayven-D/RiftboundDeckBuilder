name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      # SPEC-012 LOG-053: a production deploy cannot go out while a changelog entry still has `"date": null`.
      - name: Check every changelog entry is dated
        run: npm --prefix web run check:changelog-release

      # SPEC-010 SYNC-101 check 2: a production deploy cannot go out while the privacy notice still holds
      # "[set on release". (firebase.json's predeploy runs it again, so a local `firebase deploy --only hosting` is held too.)
      - name: Check the privacy notice release date is filled
        run: npm --prefix web run check:privacy-release

      # firebase.json's predeploy hook runs `npm --prefix web run build`: the production build
      # (appVersion web-prod-<first 7 hex of the commit>, from git or GITHUB_SHA). The account-only build must
      # not reach production until the SPEC-010 SYNC-007 release rule is met (H-063, H-152, rules deployed).
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RIFTBOUND_DECKBUILDER }}
          projectId: riftbound-deckbuilder
          channelId: live
