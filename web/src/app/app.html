<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <a class="wordmark" routerLink="/decks">Rift Decks</a>
  <nav class="site-nav" aria-label="Main">
    <ul>
      @for (item of nav; track item.path) {
        <li>
          <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{
            item.label
          }}</a>
        </li>
      }
    </ul>
  </nav>
  <a
    class="import-action"
    matButton="filled"
    routerLink="/import"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
  >
    <app-icon matButtonIcon name="upload" />
    Import
  </a>
</header>

<main id="main" class="site-main" tabindex="-1">
  <router-outlet />
</main>

<footer class="site-footer">
  <p class="legal">
    Rift Decks was created under Riot Games' "Legal Jibber Jabber" policy using assets owned by Riot
    Games. Riot Games does not endorse or sponsor this project.
  </p>
</footer>
